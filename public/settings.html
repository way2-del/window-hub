<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灵动岛设置</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #121214;
        color: #f4f4f5;
      }
      .page {
        min-height: 100%;
        padding: 20px 22px 28px;
        background: radial-gradient(
            120% 80% at 0% 0%,
            rgba(52, 199, 89, 0.14),
            transparent 55%
          ),
          #121214;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 22px;
      }
      h1 {
        font-size: 18px;
        font-weight: 650;
      }
      .sub {
        margin-top: 6px;
        font-size: 12px;
        line-height: 1.45;
        color: #9ca3af;
        max-width: 260px;
      }
      .btn {
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: #f4f4f5;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      h2 {
        font-size: 13px;
        margin-bottom: 10px;
      }
      .mode {
        width: 100%;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 12px 14px;
        margin-bottom: 8px;
        border-radius: 12px;
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.04);
        color: inherit;
        cursor: pointer;
        font: inherit;
      }
      .mode:hover {
        background: rgba(255, 255, 255, 0.07);
      }
      .mode.active {
        border-color: rgba(52, 199, 89, 0.65);
        background: rgba(52, 199, 89, 0.1);
      }
      .mode.active .label {
        color: #34c759;
      }
      .label {
        font-size: 14px;
        font-weight: 600;
      }
      .desc {
        font-size: 11px;
        color: #9ca3af;
      }
      .swatch {
        margin-top: 8px;
        height: 48px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgb(32, 32, 34);
      }
      .meta {
        margin-top: 8px;
        font-size: 11px;
        color: #9ca3af;
      }
      .err {
        margin-top: 14px;
        color: #f87171;
        font-size: 12px;
        display: none;
      }
      section + section {
        margin-top: 22px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div>
          <h1>灵动岛设置</h1>
          <p class="sub">优先跟随全屏/最大化窗口；切换后锁定，点岛不会再变</p>
        </div>
        <button class="btn" id="btn-close" type="button">关闭</button>
      </header>

      <section>
        <h2>采样模式</h2>
        <button class="mode" data-mode="edge" type="button">
          <span class="label">整条边缘</span>
          <span class="desc">左右按窗口顶边色带贴合</span>
        </button>
        <button class="mode" data-mode="center" type="button">
          <span class="label">仅取中间</span>
          <span class="desc">只采窗口中部，整条颜色一致</span>
        </button>
      </section>

      <section>
        <h2>当前顶栏色</h2>
        <div class="swatch" id="swatch"></div>
        <p class="meta" id="meta">rgb(32, 32, 34)</p>
      </section>

      <p class="err" id="err"></p>
    </div>

    <script>
      function showErr(msg) {
        const el = document.getElementById("err");
        el.style.display = "block";
        el.textContent = msg;
      }

      function getInvoke() {
        const g = window.__TAURI__;
        if (g && g.core && typeof g.core.invoke === "function") {
          return g.core.invoke.bind(g.core);
        }
        if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) {
          return window.__TAURI_INTERNALS__.invoke.bind(window.__TAURI_INTERNALS__);
        }
        return null;
      }

      function setModeUi(mode) {
        document.querySelectorAll(".mode").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.mode === mode);
        });
      }

      function paint(strip) {
        if (!strip) return;
        const sw = document.getElementById("swatch");
        const meta = document.getElementById("meta");
        const mode =
          (strip.mode && String(strip.mode).toLowerCase()) ||
          document.querySelector(".mode.active")?.dataset.mode ||
          "edge";
        if (mode === "center" || !strip.png_base64) {
          sw.style.background = `rgb(${strip.r}, ${strip.g}, ${strip.b})`;
          sw.style.backgroundImage = "none";
        } else {
          sw.style.backgroundImage = `url(data:image/png;base64,${strip.png_base64})`;
          sw.style.backgroundSize = "100% 100%";
        }
        meta.textContent = `rgb(${strip.r}, ${strip.g}, ${strip.b})`;
      }

      async function boot() {
        const invoke = getInvoke();
        if (!invoke) {
          showErr("Tauri API 未注入。请重启应用后再打开设置。");
          return;
        }

        document.getElementById("btn-close").onclick = async () => {
          try {
            await invoke("close_settings_window");
          } catch (e) {
            try {
              await window.__TAURI__.window.getCurrentWindow().destroy();
            } catch (e2) {
              showErr("关闭失败: " + (e2?.message || e2 || e));
            }
          }
        };

        document.querySelectorAll(".mode").forEach((btn) => {
          btn.onclick = async () => {
            const mode = btn.dataset.mode;
            setModeUi(mode);
            try {
              const strip = await invoke("set_ambient_mode", { mode });
              paint(strip);
            } catch (e) {
              showErr("切换模式失败: " + (e?.message || e));
            }
          };
        });

        try {
          const mode = await invoke("get_ambient_mode");
          setModeUi(mode === "center" ? "center" : "edge");
          const strip = await invoke("sample_ambient_color");
          paint(strip);
        } catch (e) {
          showErr("读取设置失败: " + (e?.message || e));
        }

        try {
          const { listen } = window.__TAURI__.event;
          await listen("ambient-color", (ev) => paint(ev.payload));
        } catch (_) {
          /* optional */
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    </script>
  </body>
</html>
