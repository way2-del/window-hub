<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中转站</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <div class="ts-root" id="root">
      <header class="ts-head">
        <span class="ts-title">中转站</span>
        <div class="ts-head-right">
          <button type="button" class="ts-more" id="btn-more" aria-label="更多" aria-expanded="false">
            ···
          </button>
          <div class="ts-menu" id="menu" hidden>
            <button type="button" id="menu-clear">清空全部</button>
          </div>
        </div>
      </header>
      <div class="ts-body">
        <button type="button" class="ts-action" id="btn-copy-all" title="复制全部文件路径">
          <svg class="ts-action-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="2.2" fill="currentColor" />
            <path
              stroke="currentColor"
              stroke-width="1.6"
              d="M8.2 8.2a5.4 5.4 0 0 1 7.6 0M6.1 6.1a8.4 8.4 0 0 1 11.8 0M4 4a11.2 11.2 0 0 1 16 0"
              stroke-linecap="round"
            />
          </svg>
          <span>复制路径</span>
        </button>
        <div class="ts-rail" id="rail" role="list">
          <p class="ts-hint" id="empty">拖入文件、文字、链接或图片</p>
        </div>
      </div>
    </div>
    <script src="./panel.js"></script>
  </body>
</html>
