[package]
name = "window-hub"
version = "0.2.0"
description = "Windows window mosaic hub with ECS capture and input forwarding"
authors = ["you"]
edition = "2021"

[lib]
name = "window_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy_ecs = "0.15"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp", "ico"] }
parking_lot = "0.12"
window-vibrancy = "0.6"
zip = "2.2"
rfd = "0.15"
drag = { version = "2.1", features = ["serde"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
ureq = { version = "2.12", features = ["json"] }
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
# Vendored: blank NIF_ICON frames (WeChat flash) must not be dropped.
systray-util = { path = "vendor/systray-util" }
webview2-com = "0.38"
# Match webview2-com / wry (Interface::cast); app Win32 APIs stay on windows 0.58.
windows-core-wv = { package = "windows-core", version = "0.61" }
winreg = "0.52"
windows-core = { version = "0.58" }
windows = { version = "0.58", features = [
  "implement",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_TextServices",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Memory",
  "Win32_System_DataExchange",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Environment",
  "Win32_System_Services",
  "Win32_System_RemoteDesktop",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_NetworkManagement_WiFi",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Foundation",
  "Foundation_Numerics",
  "Graphics_Effects",
  "System",
  "UI",
  "UI_Composition",
  "UI_Composition_Desktop",
] }

# Dev: line-tables-only keeps stack traces but avoids full DWARF (often tens of GB).
[profile.dev]
debug = "line-tables-only"
# Cap incremental cache growth; still fast enough for day-to-day rebuilds.
incremental = true

# Formal release: keep reasonable link cost (thin LTO).
[profile.release]
lto = "thin"
codegen-units = 8
strip = true

# Local iterate: prioritize rebuild/link speed over peak runtime opt.
# First build of this profile is still a full cold compile (~same as release);
# later incremental rebuilds are much faster with incremental = true.
# Prefer this OR debug for daily work — keeping both profiles warm doubles disk use.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 1
debug = false
strip = "none"
incremental = true
